<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Concierge</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f7fafc;
            color: #2d3748;
            margin: 0;
            padding: 40px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 32px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1a202c;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitle {
            font-size: 14px;
            color: #718096;
            margin: 0 0 24px 0;
            text-align: center;
        }
        .input-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
        }
        .btn-submit {
            width: 100%;
            background: #3182ce;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background: #2b6cb0;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h1 class="title">Contract Concierge</h1>
        <p class="subtitle">Quick-generate and send automated agreements</p>

        <form action="/submit-contract" method="POST">
            <div class="input-group">
                <label for="first_name">Buyer First Name</label>
                <input type="text" id="first_name" name="first_name" placeholder="John" required>
            </div>

            <div class="input-group">
                <label for="last_name">Buyer Last Name</label>
                <input type="text" id="last_name" name="last_name" placeholder="Doe" required>
            </div>

            <div class="input-group">
                <label for="email">Buyer Email</label>
                <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
            </div>

            <div class="input-group">
                <label for="property_address">Property Address</label>
                <input type="text" id="property_address" name="property_address" placeholder="123 Ocean Blvd, Tampa, FL" required>
            </div>

            <div class="input-group">
                <label for="purchase_price">Purchase Price ($)</label>
                <input type="number" id="purchase_price" name="purchase_price" placeholder="450000" required>
            </div>

            <button type="submit" class="btn-submit">Dispatch Agreement</button>
        </form>
    </div>
</body>
</html>
